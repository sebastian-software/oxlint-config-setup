name: Package

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }} · Oxlint ${{ matrix.oxlint }} · tsgolint ${{ matrix.tsgolint }} · TS ${{ matrix.typescript }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - node: 24.11.0
            oxlint: 1.77.0
            tsgolint: 7.0.2001
            typescript: 7.0.2
            pnpm: 11.20.0
          - node: 26.x
            oxlint: 1.77.0
            tsgolint: 7.0.2001
            typescript: 7.0.2
            pnpm: 11.20.0

    env:
      TESTED_OXLINT_VERSION: ${{ matrix.oxlint }}
      TESTED_TSGOLINT_VERSION: ${{ matrix.tsgolint }}
      TESTED_TYPESCRIPT_VERSION: ${{ matrix.typescript }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ matrix.pnpm }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install the pinned build toolchain
        run: pnpm install --frozen-lockfile
      - name: Run the complete beta release gate
        run: pnpm run release:check
      - name: Record the tested version matrix
        run: >-
          node -e
          'console.log(JSON.stringify({ node: process.version, oxlint: process.env.TESTED_OXLINT_VERSION, tsgolint: process.env.TESTED_TSGOLINT_VERSION, typescript: process.env.TESTED_TYPESCRIPT_VERSION, pnpm: "${{ matrix.pnpm }}" }, null, 2))'
          > tested-version-matrix.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tested-version-matrix-node-${{ matrix.node }}
          path: tested-version-matrix.json
          if-no-files-found: error
      - name: Reject tracked output changes
        run: git diff --exit-code

  pack:
    name: Build consumer artifact
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.20.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install the pinned build toolchain
        run: pnpm install --frozen-lockfile
      - name: Create the artifact directory
        run: mkdir -p release
      - name: Build the consumer tarball
        run: pnpm pack --pack-destination release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package-tarball
          path: release/*.tgz
          if-no-files-found: error

  docs:
    name: Build documentation site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.20.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install the pinned documentation toolchain
        run: pnpm install --frozen-lockfile
      - name: Build and validate the documentation site
        run: pnpm run docs:check
      - name: Reject generated documentation drift
        run: git diff --exit-code

  consumer:
    name: Consume on Node ${{ matrix.node }}
    needs: pack
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node:
          - 24.11.0
          - 26.0.0

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: package-tarball
          path: release
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Create an isolated consumer
        run: mkdir consumer
      - name: Initialize the consumer manifest
        run: npm init -y
        working-directory: consumer
      - name: Install the built API without peer auto-installation
        run: npm install --ignore-scripts --no-audit --no-fund --legacy-peer-deps ../release/*.tgz
        working-directory: consumer
      - name: Run the built loader on the consumer matrix
        run: >-
          node --input-type=module -e
          'import("oxlint-config-setup").then(({ getOxlintConfig, getSyntaxOnlyOxlintConfig }) => { const config = getOxlintConfig({ ai: true }); if (config.options?.typeAware !== true || config.rules?.["eslint/no-warning-comments"] !== "warn" || getSyntaxOnlyOxlintConfig().options?.typeAware !== false) process.exit(1); })'
        working-directory: consumer

  required:
    # Configure exactly "Package / Required" as the required main-branch check.
    # Its fixed name remains stable when the version matrix changes.
    name: Required
    if: ${{ always() }}
    needs:
      - verify
      - pack
      - consumer
      - docs
    runs-on: ubuntu-latest

    steps:
      - name: Fail when a Package job is not successful
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          PACK_RESULT: ${{ needs.pack.result }}
          CONSUMER_RESULT: ${{ needs.consumer.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
        run: |
          failures=0
          for result_name in VERIFY_RESULT PACK_RESULT CONSUMER_RESULT DOCS_RESULT; do
            result="${!result_name}"
            if [ "$result" != "success" ]; then
              echo "::error title=Package prerequisite failed::${result_name#*_} finished with ${result}."
              failures=1
            fi
          done
          exit "$failures"
