packages:
  - "docs"
engineStrict: true
autoInstallPeers: false
peerDependencyRules:
  allowedVersions:
    "@typescript-eslint/project-service>typescript": "7.0.2"
    "@typescript-eslint/tsconfig-utils>typescript": "7.0.2"
    "@typescript-eslint/typescript-estree>typescript": "7.0.2"
    "@typescript-eslint/utils>typescript": "7.0.2"
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - ardo@4.2.0 || 6.6.0
  - tsx@4.23.12
  - '@ferrolink/darwin-arm64@0.2.2'
  - '@ferrolink/darwin-x64@0.2.2'
  - '@ferrolink/linux-arm64-gnu@0.2.2'
  - '@ferrolink/linux-arm64-musl@0.2.2'
  - '@ferrolink/linux-x64-gnu@0.2.2'
  - '@ferrolink/linux-x64-musl@0.2.2'
  - '@ferrolink/win32-arm64-msvc@0.2.2'
  - '@ferrolink/win32-x64-msvc@0.2.2'
  - ferrolink@0.2.2
